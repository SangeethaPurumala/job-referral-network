<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Referral Network</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container mt-4">


    <h2 class="text-center mb-4">
        Job Referral Network
    </h2>



    <!-- Add Person -->

    <div class="card mb-4">

        <div class="card-header">
            Add Person
        </div>


        <div class="card-body">


            <input type="text" 
                   id="id" 
                   class="form-control mb-2" 
                   placeholder="ID">


            <input type="text" 
                   id="name" 
                   class="form-control mb-2" 
                   placeholder="Name">


            <input type="email" 
                   id="email" 
                   class="form-control mb-2" 
                   placeholder="Email">


            <input type="text" 
                   id="phone" 
                   class="form-control mb-2" 
                   placeholder="Phone">


            <input type="text" 
                   id="location" 
                   class="form-control mb-3" 
                   placeholder="Location">


            <button class="btn btn-primary" onclick="addPerson()">
                Add Person
            </button>


        </div>

    </div>





    <!-- Create Referral -->


    <div class="card mb-4">


        <div class="card-header">
            Create Referral
        </div>


        <div class="card-body">


            <input type="text" 
                   id="fromId" 
                   class="form-control mb-2" 
                   placeholder="From Person ID">


            <input type="text" 
                   id="toId" 
                   class="form-control mb-3" 
                   placeholder="To Person ID">


            <button class="btn btn-success" onclick="createReferral()">
                Create Referral
            </button>


        </div>


    </div>






    <!-- Find Referrals -->


    <div class="card mb-4">


        <div class="card-header">
            Find Referrals
        </div>


        <div class="card-body">


            <input type="text" 
                   id="searchId" 
                   class="form-control mb-3" 
                   placeholder="Enter Person ID">


            <button class="btn btn-warning" onclick="findReferrals()">
                Search
            </button>


        </div>


    </div>







    <!-- Persons -->


    <div class="card">


        <div class="card-header">
            Persons
        </div>


        <div class="card-body">


            <button class="btn btn-dark mb-3" onclick="loadPersons()">
                Load Persons
            </button>



            <div id="persons">

            </div>



        </div>


    </div>



</div>




<!-- JavaScript -->

<script src="app.js"></script>


</body>

</html>
